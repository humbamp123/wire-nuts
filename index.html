<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire Nut Size Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .wire-inputs {
            margin-bottom: 30px;
        }

        .wire-entry {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .wire-entry label {
            font-weight: 600;
            min-width: 120px;
            color: #333;
        }

        .wire-entry input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .wire-entry input:focus {
            outline: none;
            border-color: #667eea;
        }

        .wire-entry select {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .wire-entry select:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-wire-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }

        .add-wire-btn:hover {
            background: #218838;
        }

        .calculate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 30px;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid;
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateX(5px);
        }

        .result-card.ideal {
            border-color: #28a745;
        }

        .result-card.works {
            border-color: #ffc107;
        }

        .result-card h3 {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e3c72;
        }

        .result-card .size {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
        }

        .size.orange { background: #ff6b35; }
        .size.yellow { background: #f7b731; }
        .size.red { background: #eb3b5a; }
        .size.blue { background: #3867d6; }
        .size.tan { background: #d4a574; }
        .size.gray { background: #6c757d; }
        .size.green { background: #26de81; }
        .size.purple { background: #a55eea; }

        .result-card .capacity {
            margin-top: 10px;
            color: #666;
            font-size: 0.95rem;
        }

        .no-results {
            background: #ffe0e0;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #d63031;
        }

        .error-message {
            background: #ffe0e0;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #d63031;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .input-summary {
            background: #e7f3ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #007bff;
        }

        .input-summary h3 {
            color: #1e3c72;
            margin-bottom: 15px;
        }

        .wire-list {
            list-style: none;
        }

        .wire-list li {
            padding: 8px 0;
            color: #333;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .wire-entry {
                flex-direction: column;
                align-items: stretch;
            }

            .wire-entry label {
                min-width: auto;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 15px;">&larr; Back to Portfolio</a>
            <h1>⚡ Wire Nut Size Calculator</h1>
            <p class="subtitle">Find the right wire connector for your electrical project</p>
        </header>

        <div class="content">
            <div class="error-message" id="errorMessage"></div>

            <div class="wire-inputs" id="wireInputs">
                <div class="wire-entry" data-index="0">
                    <label>Wire Gauge:</label>
                    <select class="wire-gauge">
                        <option value="">Select gauge...</option>
                        <option value="18">18 AWG</option>
                        <option value="16">16 AWG</option>
                        <option value="14">14 AWG</option>
                        <option value="12">12 AWG</option>
                        <option value="10">10 AWG</option>
                        <option value="8">8 AWG</option>
                        <option value="6">6 AWG</option>
                    </select>
                    <label>Quantity:</label>
                    <input type="number" class="wire-count" min="1" max="20" value="2" placeholder="Number of wires">
                </div>
            </div>

            <button class="add-wire-btn" onclick="addWireEntry()">+ Add Different Wire Gauge</button>

            <button class="calculate-btn" onclick="calculateWireNut()">Calculate Wire Nut Size</button>

            <div class="results" id="results"></div>
        </div>
    </div>

    <script>
        // Wire nut database with specifications from major brands
        const wireNuts = [
            // Ideal Wing-Nut (Orange - Small)
            {
                brand: "Ideal",
                model: "30-072",
                color: "Orange",
                minWires: { 18: 2, 16: 0, 14: 0 },
                maxWires: { 18: 2, 16: 2, 14: 2 }
            },
            // Ideal Wing-Nut (Yellow)
            {
                brand: "Ideal",
                model: "30-073",
                color: "Yellow",
                minWires: { 18: 0, 16: 2, 14: 0, 12: 0 },
                maxWires: { 18: 4, 16: 3, 14: 3, 12: 2 }
            },
            // Ideal Wing-Nut (Red)
            {
                brand: "Ideal",
                model: "30-074",
                color: "Red",
                minWires: { 18: 0, 16: 0, 14: 2, 12: 2, 10: 0 },
                maxWires: { 18: 6, 16: 5, 14: 4, 12: 4, 10: 2 }
            },
            // Ideal Wing-Nut (Blue/Tan)
            {
                brand: "Ideal",
                model: "30-094",
                color: "Blue",
                minWires: { 16: 0, 14: 3, 12: 0, 10: 0 },
                maxWires: { 16: 6, 14: 5, 12: 4, 10: 3 }
            },
            // Ideal Wing-Nut (Gray)
            {
                brand: "Ideal",
                model: "30-642",
                color: "Gray",
                minWires: { 14: 0, 12: 2, 10: 0, 8: 0, 6: 0 },
                maxWires: { 14: 6, 12: 5, 10: 4, 8: 3, 6: 2 }
            },
            // 3M Scotchlok (Orange)
            {
                brand: "3M Scotchlok",
                model: "R/O",
                color: "Orange",
                minWires: { 18: 2, 16: 0, 14: 0 },
                maxWires: { 18: 2, 16: 2, 14: 2 }
            },
            // 3M Scotchlok (Yellow)
            {
                brand: "3M Scotchlok",
                model: "R/Y",
                color: "Yellow",
                minWires: { 18: 0, 16: 2, 14: 0, 12: 0 },
                maxWires: { 18: 4, 16: 3, 14: 3, 12: 2 }
            },
            // 3M Scotchlok (Red)
            {
                brand: "3M Scotchlok",
                model: "R/R",
                color: "Red",
                minWires: { 18: 0, 16: 0, 14: 2, 12: 2, 10: 0 },
                maxWires: { 18: 5, 16: 4, 14: 4, 12: 3, 10: 2 }
            },
            // 3M Scotchlok (Blue)
            {
                brand: "3M Scotchlok",
                model: "R/B",
                color: "Blue",
                minWires: { 14: 3, 12: 0, 10: 0 },
                maxWires: { 14: 5, 12: 4, 10: 3 }
            },
            // 3M Scotchlok (Gray)
            {
                brand: "3M Scotchlok",
                model: "R/G",
                color: "Gray",
                minWires: { 12: 2, 10: 0, 8: 0, 6: 0 },
                maxWires: { 12: 4, 10: 3, 8: 3, 6: 2 }
            },
            // Gardner Bender (Orange)
            {
                brand: "Gardner Bender",
                model: "WingGard",
                color: "Orange",
                minWires: { 18: 2, 16: 0, 14: 0 },
                maxWires: { 18: 2, 16: 2, 14: 2 }
            },
            // Gardner Bender (Yellow)
            {
                brand: "Gardner Bender",
                model: "WingGard",
                color: "Yellow",
                minWires: { 18: 0, 16: 2, 14: 0, 12: 0 },
                maxWires: { 18: 4, 16: 3, 14: 3, 12: 2 }
            },
            // Gardner Bender (Red)
            {
                brand: "Gardner Bender",
                model: "WingGard",
                color: "Red",
                minWires: { 14: 2, 12: 2, 10: 0 },
                maxWires: { 14: 4, 12: 4, 10: 2 }
            },
            // King Innovation TwistOn (Orange)
            {
                brand: "King Innovation",
                model: "TwistOn",
                color: "Orange",
                minWires: { 18: 2, 16: 0, 14: 0 },
                maxWires: { 18: 2, 16: 2, 14: 2 }
            },
            // King Innovation TwistOn (Yellow)
            {
                brand: "King Innovation",
                model: "TwistOn",
                color: "Yellow",
                minWires: { 18: 0, 16: 2, 14: 0, 12: 0 },
                maxWires: { 18: 4, 16: 3, 14: 3, 12: 2 }
            },
            // King Innovation TwistOn (Red)
            {
                brand: "King Innovation",
                model: "TwistOn",
                color: "Red",
                minWires: { 14: 2, 12: 2, 10: 0 },
                maxWires: { 14: 4, 12: 4, 10: 3 }
            }
        ];

        let wireEntryCount = 1;

        function addWireEntry() {
            const wireInputs = document.getElementById('wireInputs');
            const newEntry = document.createElement('div');
            newEntry.className = 'wire-entry';
            newEntry.setAttribute('data-index', wireEntryCount);
            newEntry.innerHTML = `
                <label>Wire Gauge:</label>
                <select class="wire-gauge">
                    <option value="">Select gauge...</option>
                    <option value="18">18 AWG</option>
                    <option value="16">16 AWG</option>
                    <option value="14">14 AWG</option>
                    <option value="12">12 AWG</option>
                    <option value="10">10 AWG</option>
                    <option value="8">8 AWG</option>
                    <option value="6">6 AWG</option>
                </select>
                <label>Quantity:</label>
                <input type="number" class="wire-count" min="1" max="20" value="2" placeholder="Number of wires">
                <button class="remove-btn" onclick="removeWireEntry(${wireEntryCount})">Remove</button>
            `;
            wireInputs.appendChild(newEntry);
            wireEntryCount++;
        }

        function removeWireEntry(index) {
            const entry = document.querySelector(`[data-index="${index}"]`);
            if (entry) {
                entry.remove();
            }
        }

        function calculateWireNut() {
            // Clear previous results and errors
            const errorMessage = document.getElementById('errorMessage');
            const resultsDiv = document.getElementById('results');
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Collect wire inputs
            const wireEntries = document.querySelectorAll('.wire-entry');
            const wireCombination = {};
            let totalWires = 0;
            let hasError = false;

            wireEntries.forEach(entry => {
                const gauge = entry.querySelector('.wire-gauge').value;
                const count = parseInt(entry.querySelector('.wire-count').value) || 0;

                if (!gauge) {
                    errorMessage.textContent = 'Please select a wire gauge for all entries.';
                    errorMessage.classList.add('show');
                    hasError = true;
                    return;
                }

                if (count <= 0) {
                    errorMessage.textContent = 'Please enter a valid quantity (at least 1) for all wire entries.';
                    errorMessage.classList.add('show');
                    hasError = true;
                    return;
                }

                wireCombination[gauge] = (wireCombination[gauge] || 0) + count;
                totalWires += count;
            });

            if (hasError) {
                resultsDiv.classList.remove('show');
                return;
            }

            if (totalWires < 2) {
                errorMessage.textContent = 'You need at least 2 wires to make a connection.';
                errorMessage.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            // Find compatible wire nuts
            const compatibleNuts = [];

            wireNuts.forEach(nut => {
                let isCompatible = true;
                let isIdeal = true;

                // Check if this wire nut can handle all the wires
                for (const [gauge, count] of Object.entries(wireCombination)) {
                    const maxAllowed = nut.maxWires[gauge] || 0;
                    const minRequired = nut.minWires[gauge] || 0;

                    if (count > maxAllowed || count < minRequired) {
                        isCompatible = false;
                        break;
                    }

                    // Check if it's ideal (close to max capacity)
                    if (count < maxAllowed - 2) {
                        isIdeal = false;
                    }
                }

                if (isCompatible) {
                    compatibleNuts.push({
                        ...nut,
                        isIdeal: isIdeal
                    });
                }
            });

            // Display results
            displayResults(compatibleNuts, wireCombination, totalWires);
        }

        function displayResults(compatibleNuts, wireCombination, totalWires) {
            const resultsDiv = document.getElementById('results');

            if (compatibleNuts.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="no-results">
                        <h3>⚠️ No Compatible Wire Nuts Found</h3>
                        <p>The combination of wires you entered exceeds the capacity of standard wire nuts.</p>
                        <p>Consider using a junction box with terminal blocks or splitting the connection.</p>
                    </div>
                `;
            } else {
                // Create summary of wire combination
                const wireListHTML = Object.entries(wireCombination)
                    .map(([gauge, count]) => `<li>${count} × ${gauge} AWG wire${count > 1 ? 's' : ''}</li>`)
                    .join('');

                // Sort: ideal first, then by color (smaller to larger)
                const colorOrder = { 'Orange': 1, 'Yellow': 2, 'Red': 3, 'Blue': 4, 'Tan': 4, 'Gray': 5, 'Green': 6, 'Purple': 7 };
                compatibleNuts.sort((a, b) => {
                    if (a.isIdeal && !b.isIdeal) return -1;
                    if (!a.isIdeal && b.isIdeal) return 1;
                    return (colorOrder[a.color] || 99) - (colorOrder[b.color] || 99);
                });

                let resultsHTML = `
                    <div class="input-summary">
                        <h3>Your Wire Combination:</h3>
                        <ul class="wire-list">
                            ${wireListHTML}
                            <li><strong>Total: ${totalWires} wire${totalWires > 1 ? 's' : ''}</strong></li>
                        </ul>
                    </div>
                    <h2 style="margin-bottom: 20px; color: #1e3c72;">Recommended Wire Nuts:</h2>
                `;

                compatibleNuts.forEach(nut => {
                    const maxCapacityStr = Object.entries(nut.maxWires)
                        .map(([gauge, count]) => `${count}×${gauge}AWG`)
                        .join(', ');

                    resultsHTML += `
                        <div class="result-card ${nut.isIdeal ? 'ideal' : 'works'}">
                            <h3>
                                <span class="brand">${nut.brand}</span>
                                <span class="size ${nut.color.toLowerCase()}">${nut.color}</span>
                                ${nut.isIdeal ? '<span style="color: #28a745;">✓ Ideal Match</span>' : '<span style="color: #ffc107;">⚠ Works</span>'}
                            </h3>
                            <div class="capacity">
                                <strong>Model:</strong> ${nut.model}<br>
                                <strong>Max Capacity:</strong> ${maxCapacityStr}
                            </div>
                        </div>
                    `;
                });

                resultsDiv.innerHTML = resultsHTML;
            }

            resultsDiv.classList.add('show');
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
